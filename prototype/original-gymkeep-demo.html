<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymKeep — Retention Platform Demo</title>
<style>
:root{--bg:#0c100e;--panel:#151c18;--panel2:#1c2620;--line:#2b3930;--text:#f2f6f1;--muted:#9eada2;--lime:#b7f34a;--red:#ff6868;--amber:#ffc65c;--green:#8fe36b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--lime);color:#10160d;font-weight:750}button.secondary{background:#27332b;color:var(--text);border:1px solid var(--line)}button.danger{background:#492323;color:#ffdede;border:1px solid #7a3939}button.small{padding:7px 10px;font-size:13px}.app{max-width:1250px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:22px;font-weight:900;letter-spacing:.7px}.brand span{color:var(--lime)}.sub{color:var(--muted);font-size:12px}.rolebar,.tabs{display:flex;gap:8px;flex-wrap:wrap}.rolebar button,.tabs button{background:#202a23;color:#cdd8ce;border:1px solid var(--line)}.rolebar button.active,.tabs button.active{background:var(--lime);color:#11180e;border-color:var(--lime)}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.side,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px}.side{padding:14px;height:max-content}.nav{display:grid;gap:7px;margin-top:12px}.nav button{text-align:left;background:transparent;color:var(--muted);border:1px solid transparent}.nav button.active{background:var(--panel2);border-color:var(--line);color:var(--lime)}.content{min-width:0}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:3px 0 16px}.heading h1{font-size:25px;margin:0 0 4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px;margin-bottom:12px}.metric{font-size:28px;font-weight:850;margin:7px 0 2px}.muted{color:var(--muted)}.lime{color:var(--lime)}.dangerText{color:var(--red)}.amber{color:var(--amber)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#27372a;color:#b9ef8a;white-space:nowrap}.pill.red{background:#432525;color:#ffaaaa}.pill.amber{background:#41351f;color:#ffdb8a}.pill.gray{background:#28302b;color:#bdc8bf}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:13px;background:#111713}.item strong{display:block}.item small{color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.progress{height:8px;background:#2a342d;border-radius:9px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--lime);border-radius:9px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;background:#0e1410;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600}.empty{padding:22px;text-align:center;color:var(--muted)}.notice{border:1px solid #465735;background:#1e2a19;padding:12px;border-radius:12px;color:#d9f2c7;margin:10px 0}.qr{width:170px;height:170px;margin:15px auto;background:white;color:#111;display:grid;place-items:center;border-radius:10px;font-size:50px;position:relative}.qr:before{content:"";position:absolute;inset:14px;border:8px dashed #111}.qr span{z-index:1;background:white;padding:5px}.hide{display:none!important}.footer{color:#718076;font-size:11px;text-align:center;padding:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e5f8d1;color:#17200f;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 8px 30px #0008;z-index:9}
@media(max-width:800px){.app{padding:12px}.layout{grid-template-columns:1fr}.side{padding:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.heading h1{font-size:21px}.top{align-items:flex-start;flex-direction:column}.rolebar{width:100%}.rolebar button{flex:1}}
@media(max-width:420px){.grid.two{grid-template-columns:1fr}.metric{font-size:24px}.card{padding:13px}}
</style>
</head>
<body><div class="app">
<header class="top"><div><div class="brand">GYM<span>KEEP</span></div><div class="sub">EVERY MEMBER MATTERS · DEMO GYM · LUCKNOW</div></div><div class="rolebar" id="roles"><button class="active" data-role="owner">Owner</button><button data-role="member">Member</button><button data-role="staff">Front desk</button></div></header>
<div class="layout"><aside class="side"><div class="sub" id="roleLabel">OWNER WORKSPACE</div><div class="nav" id="nav"></div><div class="notice" style="font-size:12px;margin-top:18px">Demo mode<br><span class="muted">Sample data only. No real payments or messages.</span></div></aside><main class="content"><div id="view"></div></main></div>
<div class="footer">GYMKEEP PROTOTYPE · Sample records are fictional · Payments are simulated</div></div>
<script>
const seed=[
["Aarav Sharma","9876543210","Quarterly","05 Nov 2026","22 Oct",10,"Rohit"],
["Priya Verma","9876543211","Monthly","04 Nov 2026","18 Oct",14,"Ankit"],
["Rohan Singh","9876543212","Yearly","18 Feb 2027","12 Oct",20,"Vikram"],
["Neha Gupta","9876543213","Quarterly","07 Nov 2026","20 Oct",12,"Rohit"],
["Aditya Yadav","9876543214","Monthly","03 Nov 2026","30 Oct",2,"Ankit"],
["Kavya Mishra","9876543215","Half-yearly","06 Nov 2026","31 Oct",1,"Vikram"],
["Arjun Patel","9876543216","Quarterly","20 Dec 2026","01 Nov",0,"Rohit"],
["Ananya Saxena","9876543217","Yearly","15 Mar 2027","30 Oct",2,"Ankit"],
["Vivek Tiwari","9876543218","Monthly","12 Dec 2026","29 Oct",3,"Vikram"],
["Sneha Pandey","9876543219","Quarterly","21 Jan 2027","01 Nov",0,"Rohit"],
["Rahul Chauhan","9876543220","Monthly","17 Dec 2026","31 Oct",1,"Ankit"],
["Ishita Agarwal","9876543221","Half-yearly","22 Apr 2027","30 Oct",2,"Vikram"],
["Kunal Srivastava","9876543222","Quarterly","19 Dec 2026","01 Nov",0,"Rohit"],
["Simran Kaur","9876543223","Monthly","26 Dec 2026","29 Oct",3,"Ankit"],
["Manish Rajput","9876543224","Yearly","11 Jun 2027","01 Nov",0,"Vikram"],
["Pooja Shukla","9876543225","Quarterly","30 Dec 2026","28 Oct",4,"Rohit"],
["Devansh Mishra","9876543226","Monthly","14 Jan 2027","31 Oct",1,"Ankit"],
["Sakshi Jain","9876543227","Half-yearly","17 May 2027","01 Nov",0,"Vikram"],
["Harsh Vardhan","9876543228","Quarterly","28 Dec 2026","30 Oct",2,"Rohit"],
["Ritika Singh","9876543229","Monthly","25 Jan 2027","01 Nov",0,"Ankit"],
["Mohit Kumar","9876543230","Yearly","20 Jul 2027","01 Nov",0,"Vikram"],
["Tanya Kapoor","9876543231","Quarterly","10 Jan 2027","29 Oct",3,"Rohit"],
["Abhishek Gupta","9876543232","Monthly","18 Jan 2027","01 Nov",0,"Ankit"],
["Nisha Verma","9876543233","Half-yearly","02 Jun 2027","30 Oct",2,"Vikram"],
["Yash Thakur","9876543234","Quarterly","15 Feb 2027","01 Nov",0,"Rohit"],
["Muskan Ali","9876543235","Monthly","08 Feb 2027","31 Oct",1,"Ankit"],
["Siddharth Jain","9876543236","Yearly","09 Aug 2027","01 Nov",0,"Vikram"],
["Divya Pandey","9876543237","Quarterly","17 Feb 2027","30 Oct",2,"Rohit"],
["Kartik Soni","9876543238","Monthly","24 Feb 2027","01 Nov",0,"Ankit"],
["Meera Joshi","9876543239","Half-yearly","13 Sep 2027","01 Nov",0,"Vikram"]];
let members=seed.map((x,i)=>({id:i+1,name:x[0],phone:x[1],plan:x[2],expiry:x[3],last:x[4],days:x[5],trainer:x[6],outcome:"",next:""}));
let role="owner",page="Dashboard",toastTimer;
let state={qr:"",payment:"",marketing:true,addon:"",search:"",reason:"Member forgot phone",reminders:{"14":true,"7":true,"3":true,"0":true}};
const navs={owner:["Dashboard","At-risk members","Members","Renewals","Add-ons & stock","Settings"],member:["Home","QR check-in","Attendance","Renewal","Add-ons","Preferences"],staff:["Check-in","Member lookup","Order fulfilment"]};
const $=s=>document.querySelector(s);
function toast(s){let t=document.createElement("div");t.className="toast";t.textContent=s;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2600)}
function money(n){return "₹"+n.toLocaleString("en-IN")}
function setRole(r){role=r;page=navs[r][0];document.querySelectorAll("[data-role]").forEach(b=>b.classList.toggle("active",b.dataset.role===r));render()}
document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>setRole(b.dataset.role));
function go(p){page=p;render()}
function shell(title,desc,body){return `<div class="heading"><div><h1>${title}</h1><div class="sub">${desc||""}</div></div></div>${body}`}
function card(label,value,sub,extra=""){return `<div class="card"><div class="sub">${label}</div><div class="metric">${value}</div><div class="sub">${sub}</div>${extra}</div>`}
function memberCard(m){return `<div class="item"><div class="row"><div><strong>${m.name}</strong><small>${m.phone} · ${m.plan}</small></div><span class="pill ${m.days>=10?"red":"amber"}">${m.days>=10?m.days+" days absent":"Renewal soon"}</span></div><div class="sub" style="margin-top:8px">Expiry: ${m.expiry} · Last visit: ${m.last} · Trainer: ${m.trainer}</div><div class="actions"><button class="small" onclick="follow(${m.id})">Follow up</button><button class="small secondary" onclick="toast('WhatsApp integration is not connected in this demo')">WhatsApp</button></div></div>`}
function render(){
$("#roleLabel").textContent=role.toUpperCase()+" WORKSPACE";
$("#nav").innerHTML=navs[role].map(p=>`<button class="${page===p?"active":""}" onclick="go('${p}')">${p}</button>`).join("");
let v="";
if(role==="owner")v=ownerView();if(role==="member")v=memberView();if(role==="staff")v=staffView();
$("#view").innerHTML=v;
}
function ownerView(){
if(page==="Dashboard")return shell("Good evening, Owner 👋","Sunday, 01 November 2026 · Your gym at a glance",`
<div class="grid">${card("ACTIVE MEMBERS","30","All plans")}${card("TODAY'S CHECK-INS","18","Verified visits")}${card("7-DAY ACTIVE","24","Unique members")}${card("OPEN NO-SHOW CASES",'<span class="dangerText">6</span>',"10+ eligible absent days")}${card("RETURNED MEMBERS","3","This month")}${card("RENEWALS DUE","5","Next 7 days")}${card("RENEWAL COLLECTION",money(18600),"This month")}${card("ADD-ON REVENUE",money(12450),"This month")}</div>
<div class="card"><div class="row"><h3>Needs your attention</h3><span class="pill red">Priority</span></div><div class="list"><div class="item row"><div><strong>6 members need a follow-up</strong><small>Attendance risk threshold crossed</small></div><button class="small" onclick="go('At-risk members')">Review</button></div><div class="item row"><div><strong>5 memberships expiring soon</strong><small>Renewal reminders and collection</small></div><button class="small" onclick="go('Renewals')">Review</button></div></div></div>
<div class="card"><h3>Today's owner summary</h3><div class="list"><div class="row"><span class="muted">Check-ins</span><b>18</b></div><div class="row"><span class="muted">New risk cases</span><b>2</b></div><div class="row"><span class="muted">Follow-ups completed</span><b>4</b></div><div class="row"><span class="muted">Verified renewals</span><b>3</b></div><div class="row"><span class="muted">Add-on orders</span><b>2</b></div></div></div>`);
if(page==="At-risk members")return shell("At-risk members","Sample threshold: 10 eligible absence days. Paused, frozen, expired and cancelled members are excluded.",`<div class="list">${members.filter(m=>m.days>=10).map(memberCard).join("")}</div>`);
if(page==="Members")return shell("Member directory","Search the gym's sample member records",`<div class="card"><input id="memberSearch" placeholder="Search name or mobile number" oninput="filterMembers()"><div id="memberRows" class="list" style="margin-top:12px">${members.map(m=>`<div class="item row"><div><strong>${m.name}</strong><small>${m.phone} · ${m.plan} · Expires ${m.expiry}</small></div><span class="pill ${m.days>=10?"red":"gray"}">${m.days>=10?"At risk":"Active"}</span></div>`).join("")}</div></div>`);
if(page==="Renewals")return shell("Renewal pipeline","Memberships expiring in the next 7 days",`<div class="list">${members.filter(m=>["03 Nov 2026","04 Nov 2026","05 Nov 2026","06 Nov 2026","07 Nov 2026"].includes(m.expiry)).map(m=>`<div class="item"><div class="row"><strong>${m.name}</strong><span class="pill amber">${m.expiry}</span></div><small>${m.plan} · ${m.phone}</small><div class="actions"><button class="small" onclick="toast('Demo reminder queued for ${m.name}')">Queue reminder</button></div></div>`).join("")}</div><div class="card"><h3>Payment verification sandbox</h3><p class="muted">Order RN-DEMO-0012 · ₹3,300</p><span class="pill amber" id="payState">Pending</span><div class="actions"><button onclick="payment('paid')">Simulate verified payment</button><button class="danger" onclick="payment('failed')">Simulate failure</button></div><p class="sub" id="payMessage">No membership extension until verified.</p></div>`);
if(page==="Add-ons & stock")return shell("Add-ons & stock","Manage optional services and inventory",addonCards(true));
return shell("Settings & audit","Demo configuration and business controls",`<div class="card"><h3>No-show threshold</h3><div class="field"><label>Eligible absent days</label><input type="number" value="10" min="1" id="threshold"></div><button onclick="toast('Demo setting saved')">Save setting</button></div><div class="card"><h3>Renewal reminder windows</h3>${[14,7,3,0].map(d=>`<label class="row" style="padding:9px 0"><span>${d} days before expiry</span><input type="checkbox" style="width:auto" ${state.reminders[d]?"checked":""} onchange="state.reminders[${d}]=this.checked"></label>`).join("")}<button onclick="toast('Reminder settings saved in this demo')">Save reminders</button></div><div class="card"><h3>Audit log preview</h3><p class="muted">Demo actions are shown as temporary UI feedback. Persistent, tamper-resistant audit storage requires the production backend.</p></div>`);
}
function follow(id){let m=members.find(x=>x.id===id);let outcome=prompt("Follow-up outcome: Will return / Injured / Travelling / Timing issue / Unhappy / No response / Cancelled","Will return");if(!outcome)return;m.outcome=outcome;toast("Follow-up saved for "+m.name)}
function filterMembers(){let q=$("#memberSearch").value.toLowerCase();$("#memberRows").innerHTML=members.filter(m=>(m.name+m.phone).toLowerCase().includes(q)).map(m=>`<div class="item row"><div><strong>${m.name}</strong><small>${m.phone} · ${m.plan} · ${m.expiry}</small></div><span class="pill ${m.days>=10?"red":"gray"}">${m.days>=10?"At risk":"Active"}</span></div>`).join("")||'<div class="empty">No members found</div>'}
function payment(s){state.payment=s;$("#payState").textContent=s==="paid"?"Paid · Verified (simulated)":"Failed";$("#payState").className="pill "+(s==="paid"?"":"red");$("#payMessage").textContent=s==="paid"?"Demo receipt issued. Membership extension simulated exactly once.":"Payment failed. Membership was not extended."}
function memberView(){
if(page==="Home")return shell("Hello, Aarav 👋","Your fitness journey at IronCore Fitness",`<div class="card" style="background:linear-gradient(130deg,#253822,#18231b)"><div class="row"><span class="sub">YOUR MEMBERSHIP</span><span class="pill">ACTIVE</span></div><h2>Quarterly Plan</h2><div class="row"><span class="muted">Expires 05 Nov 2026</span><b class="lime">4 days left</b></div></div><div class="grid two">${card("WEEKLY VISITS","3 / 4","Weekly goal")}${card("CURRENT STREAK","5 🔥","Planned-visit streak")}</div><div class="card"><h3>Today's check-in</h3><p class="muted">Scan the gym's current rotating QR code at reception.</p><button onclick="go('QR check-in')">▦ &nbsp; Scan gym QR</button></div><div class="card"><div class="row"><h3>Recent attendance</h3><button class="small secondary" onclick="go('Attendance')">View all</button></div><div class="list"><div class="row"><span>01 Nov · 06:42 PM</span><span class="pill">Verified</span></div><div class="row"><span>31 Oct · 07:05 AM</span><span class="pill">Verified</span></div><div class="row"><span>29 Oct · 06:55 PM</span><span class="pill">Verified</span></div></div></div><button class="secondary" onclick="go('Renewal')">Renew membership</button>`);
if(page==="QR check-in")return shell("Gym QR check-in","Demo scanner — production requires signed, rotating QR validation",`<div class="card" style="text-align:center"><div class="qr"><span>▦</span></div><h3>Scan the gym QR</h3><p class="muted">This demo simulates scan outcomes; it does not validate a real QR.</p><div class="actions" style="justify-content:center"><button onclick="qr('success')">Simulate valid scan</button><button class="secondary" onclick="qr('duplicate')">Duplicate</button><button class="danger" onclick="qr('invalid')">Invalid QR</button><button class="secondary" onclick="qr('offline')">Offline</button></div><div id="qrResult" class="notice hide"></div></div>`);
if(page==="Attendance")return shell("Attendance history","Your recent verified visits",`<div class="card"><div class="list">${["01 Nov 2026 · 06:42 PM","31 Oct 2026 · 07:05 AM","29 Oct 2026 · 06:55 PM","27 Oct 2026 · 06:30 PM","25 Oct 2026 · 07:15 AM"].map(d=>`<div class="row"><span>${d}</span><span class="pill">Verified</span></div>`).join("")}</div><p class="sub">Approved rest days and pauses are excluded from streak calculations.</p></div>`);
if(page==="Renewal")return shell("Renew your membership","Choose a plan. No automatic renewal.",`<div class="list">${[["Monthly",1200,0],["Quarterly",3300,300],["Half-yearly",6000,1200],["Yearly",10800,3600]].map(p=>`<div class="item row"><div><strong>${p[0]}</strong><small>Base ${money(p[1])} · Save ${money(p[2])}</small></div><div style="text-align:right"><b>${money(p[1]-p[2])}</b><br><button class="small" onclick="selectPlan('${p[0]}',${p[1]},${p[2]})">Choose</button></div></div>`).join("")}</div><div id="renewDetail"></div>`);
if(page==="Add-ons")return shell("Optional add-ons","No add-on is pre-selected. Review terms before purchase.",addonCards(false));
return shell("Communication preferences","Marketing consent is separate from essential membership messages.",`<div class="card"><label class="row"><span><b>Promotional offers</b><br><small class="muted">Optional offers and announcements</small></span><input type="checkbox" style="width:auto" ${state.marketing?"checked":""} onchange="state.marketing=this.checked;toast(this.checked?'Marketing enabled':'Marketing opted out')"></label><div class="notice">Essential receipts and membership service notices are managed separately. Your marketing opt-out will be respected.</div></div>`);
}
function qr(s){let el=$("#qrResult");el.classList.remove("hide");let map={success:["Check-in successful","Your demo attendance is recorded at 06:42 PM."],duplicate:["Duplicate scan","Your recent check-in already exists. No second record created."],invalid:["Invalid QR","This QR is expired, invalid or not issued by this gym."],offline:["Offline — pending sync","Not confirmed yet. It will require server validation when online."]};el.innerHTML="<b>"+map[s][0]+"</b><br>"+map[s][1]}
function selectPlan(n,p,d){$("#renewDetail").innerHTML=`<div class="card"><h3>${n} plan</h3><div class="row"><span class="muted">Base price</span><b>${money(p)}</b></div><div class="row"><span class="muted">Discount</span><b class="lime">−${money(d)}</b></div><hr style="border-color:var(--line)"><div class="row"><b>Final amount</b><h2>${money(p-d)}</h2></div><p class="sub">Gym access under selected plan. No automatic renewal. Validity begins only after verified payment.</p><button onclick="demoPay()">Simulate secure payment</button><p id="demoPayResult" class="sub"></p></div>`}
function demoPay(){let el=$("#demoPayResult");el.textContent="Payment pending — waiting for provider verification (simulated).";setTimeout(()=>{if(el.isConnected)el.textContent="Demo payment verified. Receipt issued; membership extension simulated once."},1000)}
function addonCards(owner){let arr=[["Personal Training","₹2,500","8 sessions / 30 days","Rohit · trainer qualification to be verified"],["Diet Plan","₹999","30 days","Prepared by a qualified nutrition professional"],["Whey Protein 1kg","₹2,199","8 units in stock","Sealed product; batch and expiry to be checked"],["Creatine 250g","₹899","12 units in stock","Sealed product; batch and expiry to be checked"]];return `<div class="list">${arr.map((a,i)=>`<div class="item"><div class="row"><strong>${a[0]}</strong><b>${a[1]}</b></div><small>${a[2]} · ${a[3]}</small>${owner?`<div class="actions"><button class="small secondary" onclick="toast('Catalogue item selected for management')">Manage item</button></div>`:`<div class="actions"><button class="small secondary" onclick="toast('Details and cancellation terms must be confirmed before order')">View terms</button><button class="small" onclick="toast('Added to review — no purchase made')">Select</button></div>`}</div>`).join("")}</div>`}
function staffView(){
if(page==="Check-in")return shell("Assisted check-in","Staff must verify identity, membership and record a reason",`<div class="card"><div class="field"><label>Member mobile number</label><input id="staffPhone" placeholder="Enter 10-digit mobile"></div><div class="field"><label>Reason for assisted check-in</label><select id="staffReason"><option>Member forgot phone</option><option>QR camera unavailable</option><option>Verified identity issue</option><option>Accessibility assistance</option></select></div><button onclick="staffCheck()">Verify & record demo check-in</button><div id="staffResult"></div></div>`);
if(page==="Member lookup")return shell("Member lookup","Search using member name or mobile number",`<div class="card"><input id="staffSearch" placeholder="Search member or mobile" oninput="staffFilter()"><div id="staffRows" class="list" style="margin-top:12px">${members.slice(0,8).map(staffRow).join("")}</div></div>`);
return shell("Order fulfilment","PT package and product orders",`<div class="card"><h3>PT Starter · PT-004</h3><p class="muted">8 sessions purchased · 5 used · 3 remaining</p><span class="pill">Active</span></div><div class="card"><h3>Whey Protein 1kg · AD-013</h3><p class="muted">One unit reserved</p><button onclick="toast('Order marked fulfilled in demo')">Mark fulfilled</button></div>`);
}
function staffRow(m){return `<div class="item row"><div><strong>${m.name}</strong><small>${m.phone} · ${m.plan} · ${m.expiry}</small></div><span class="pill ${m.days>=10?"red":"gray"}">${m.days>=10?"At risk":"Active"}</span></div>`}
function staffFilter(){let q=$("#staffSearch").value.toLowerCase();$("#staffRows").innerHTML=members.filter(m=>(m.name+m.phone).toLowerCase().includes(q)).map(staffRow).join("")||'<div class="empty">No member found</div>'}
function staffCheck(){let phone=$("#staffPhone").value.trim(),m=members.find(x=>x.phone===phone),r=$("#staffResult");if(!m){r.innerHTML='<div class="notice" style="background:#3a2020">Member not found. Check mobile number.</div>';return}r.innerHTML=`<div class="notice"><b>${m.name}</b><br>${m.plan} · Expires ${m.expiry}<br>Reason: ${$("#staffReason").value}<br><b>Demo check-in recorded.</b></div>`}
render();
</script></body></html>
