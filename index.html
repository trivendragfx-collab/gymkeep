<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b100e"><title>GymKeep | Master Control</title>
<style>
:root{--bg:#0b100e;--panel:#141c17;--panel2:#1b2820;--line:#2b3b30;--text:#f2f7f1;--muted:#9eada2;--accent:#b7f34a;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#11180e;font-weight:750}button.secondary{background:#243229;color:var(--text);border:1px solid var(--line)}button.danger{background:#492323;color:#ffdede}.app{max-width:1440px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{font-weight:950;font-size:24px;letter-spacing:1px}.brand span{color:var(--accent)}.muted,.sub{color:var(--muted)}.sub{font-size:12px}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px}.side,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}.side{padding:14px;height:max-content}.nav{display:grid;gap:7px;margin-top:14px}.nav button{background:transparent;color:var(--muted);text-align:left;border:1px solid transparent}.nav button.active{background:var(--panel2);color:var(--accent);border-color:var(--line)}.main{min-width:0}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 18px}.heading h1{font-size:25px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{padding:16px;margin-bottom:12px}.metric{font-size:28px;font-weight:850;margin:7px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row.wrap{flex-wrap:wrap}.list{display:grid;gap:9px}.item{background:#101713;border:1px solid var(--line);border-radius:12px;padding:13px}.pill{font-size:11px;border-radius:30px;padding:4px 9px;background:#293a2b;color:#c9f4a2}.pill.warn{background:#42351f;color:#ffdb8a}.pill.off{background:#422525;color:#ffb4b4}.field{display:grid;gap:5px;margin:11px 0}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;background:#0d1410;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:28px;text-align:center;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{background:#202b1c;border:1px solid #465735;padding:12px;border-radius:12px;color:#d9f2c7;margin:10px 0}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:30px;height:30px;border-radius:8px;border:2px solid #fff4}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e7f8d6;color:#14200e;padding:12px 18px;border-radius:10px;font-weight:750;box-shadow:0 8px 30px #0008}.hide{display:none!important}
@media(max-width:850px){.app{padding:12px}.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}.heading{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.two{grid-template-columns:1fr}.metric{font-size:23px}}
</style><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><div class="app"><div id="authGate" style="display:none;position:fixed;inset:0;z-index:50;background:#080d0b;place-items:center;padding:20px"><div class="card" style="width:min(440px,100%);padding:26px"><div class="brand">GYM<span>KEEP</span></div><h2>Super Admin sign in</h2><p class="muted">Sign in with your registered owner email. We’ll send a secure sign-in link.</p><div class="field"><label>Owner email</label><input id="authEmail" type="email" value="trivendragfx@gmail.com" autocomplete="email"></div><button id="sendLogin" style="width:100%">Send sign-in link</button><p id="authMessage" class="sub"></p></div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';
const sb=createClient('https://hhkbxiqbsxpdoittttwh.supabase.co','sb_publishable_GAmHeDORBL85ADUsD2YF6w_uJHJPSFP');
const gate=document.getElementById('authGate'),msg=document.getElementById('authMessage');
function showGate(t=''){gate.style.display='grid';msg.textContent=t;}
async function loadAdmin(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){showGate();return;}
 const {data:admin,error:ae}=await sb.from('platform_admins').select('role,status').eq('user_id',session.user.id).maybeSingle();
 if(ae){showGate('Admin verification failed: '+ae.message);return;}
 if(!admin||admin.status!=='active'){await sb.auth.signOut();showGate('This account is not an active platform administrator.');return;}
 const {data:rows,error}=await sb.from('gym_instances').select('id,name,slug,owner_email,status,plan,created_at').order('created_at',{ascending:false});
 if(error){showGate('Database access failed: '+error.message);return;}
 gate.style.display='none';window.setBackendGyms(rows||[]);
 const badge=document.querySelector('.top .pill');if(badge){badge.className='pill';badge.textContent='Connected · '+admin.role.toUpperCase();}
 const profile=document.querySelector('.top .row button');if(profile){profile.textContent=session.user.email+' · Sign out';profile.onclick=async()=>{await sb.auth.signOut();location.reload();};}
 const note=document.querySelector('.side .notice');if(note)note.innerHTML='Live database<br><span class="muted">Gym records are loaded from the control plane.</span>';
}
document.getElementById('sendLogin').addEventListener('click',async()=>{
 const email=document.getElementById('authEmail').value.trim();if(email.toLowerCase()!=='trivendragfx@gmail.com'){msg.textContent='Use the registered owner email.';return;}
 const b=document.getElementById('sendLogin');b.disabled=true;b.textContent='Sending…';
 const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.href}});
 b.disabled=false;b.textContent='Send sign-in link';msg.textContent=error?error.message:'Sign-in link sent. Check your inbox and open it on this device.';
});
sb.auth.onAuthStateChange((_event,session)=>{if(session)loadAdmin();});loadAdmin();
</script>
<header class="top"><div><div class="brand">GYM<span>KEEP</span> <span style="color:var(--text);font-size:12px;letter-spacing:0">MASTER CONTROL</span></div><div class="sub">PLATFORM OPERATIONS · SUPER ADMIN WORKSPACE</div></div><div class="row"><span class="pill warn">Backend not connected</span><button class="secondary" onclick="toast('Authentication will be enabled after Supabase setup')">Admin profile</button></div></header>
<div class="layout"><aside class="side"><div class="sub">MASTER WORKSPACE</div><nav class="nav" id="nav"></nav><div class="notice" style="font-size:11px">Build preview<br><span class="muted">Changes are saved in this browser only until the backend is connected.</span></div></aside><main class="main" id="view"></main></div></div>
<script>
const pages=['Overview','Gym instances','Create gym','Branding & UI','Features','Subscriptions','Administrators','Platform settings'];
let page='Overview', gyms=[], accent=localStorage.getItem('gk_accent')||'#b7f34a';
const $=s=>document.querySelector(s);
function save(){localStorage.setItem('gk_accent',accent)}
window.setBackendGyms=function(rows){gyms=rows.map(g=>({id:g.id,name:g.name,slug:g.slug,owner:g.owner_email||'',status:g.status==='active'?'Active':g.status==='suspended'?'Suspended':g.status,plan:g.plan,created:g.created_at}));render()};
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)}
function go(p){page=p;render()}
function id(){return 'gym_'+Math.random().toString(36).slice(2,9)}
function render(){document.documentElement.style.setProperty('--accent',accent);$('#nav').innerHTML=pages.map(p=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+p+'\')">'+p+'</button>').join('');let v='';
if(page==='Overview')v='<div class="heading"><div><h1>Platform overview</h1><div class="sub">Your central command centre for every GymKeep instance.</div></div><button onclick="go(\'Create gym\')">＋ Create gym</button></div><div class="grid">'+metric('TOTAL GYMS',gyms.length,'Provisioned instances')+metric('ACTIVE GYMS',gyms.filter(g=>g.status==='Active').length,'Currently enabled')+metric('SUSPENDED',gyms.filter(g=>g.status==='Suspended').length,'Access disabled')+metric('PLATFORM ADMINS','—','Connect backend to load')+'</div><div class="card"><h3>Recent gym instances</h3>'+gymList(gyms.slice(-5).reverse())+'</div><div class="notice">This is the first frontend milestone. Gym creation is currently a local preview; secure server-side provisioning, authentication and separate tenant databases require the connected Supabase control plane.</div>';
if(page==='Gym instances')v='<div class="heading"><div><h1>Gym instances</h1><div class="sub">Manage independent gym workspaces.</div></div><button onclick="go(\'Create gym\')">＋ Create gym</button></div><div class="card">'+gymList(gyms)+'</div>';
if(page==='Create gym')v='<div class="heading"><div><h1>Create a gym</h1><div class="sub">Set up a new branded GymKeep instance.</div></div></div><div class="card" style="max-width:700px"><form onsubmit="createGym(event)"><div class="field"><label>Gym / business name</label><input id="gymName" required placeholder="e.g. IronCore Fitness"></div><div class="field"><label>Unique URL slug</label><input id="gymSlug" required placeholder="ironcore"></div><div class="field"><label>Owner email</label><input id="gymEmail" type="email" required placeholder="owner@example.com"></div><div class="field"><label>Primary brand colour</label><input id="gymColor" type="color" value="#b7f34a"></div><div class="field"><label>Initial plan</label><select id="gymPlan"><option>Starter</option><option>Growth</option><option>Pro</option></select></div><button type="submit">Create preview instance</button></form></div>';
if(page==='Branding & UI')v='<div class="heading"><div><h1>Branding & UI</h1><div class="sub">Set the default look and feel for newly created gyms.</div></div></div><div class="two"><div class="card"><h3>Platform accent colour</h3><div class="field"><label>Choose accent</label><input type="color" id="accentPick" value="'+accent+'" onchange="setAccent(this.value)"></div><div class="swatches">'+['#b7f34a','#55d6c2','#62a5ff','#c18aff','#ff9b62'].map(c=>'<button class="swatch" style="background:'+c+'" onclick="setAccent(\''+c+'\')"></button>').join('')+'</div></div><div class="card"><h3>Tenant customization</h3><p class="muted">Per-gym logo, app name, primary/secondary colours, navigation, page visibility and feature flags will be stored in each tenant configuration.</p><span class="pill warn">Backend schema pending</span></div></div>';
if(page==='Features')v='<div class="heading"><div><h1>Feature catalogue</h1><div class="sub">Feature flags available to tenant apps.</div></div></div><div class="card">'+['Member management','Memberships & renewals','QR attendance','Staff-assisted attendance','At-risk retention','Inventory & add-ons','Analytics','Online payments','Marketing automations'].map(x=>'<div class="row item"><strong>'+x+'</strong><span class="pill">Planned</span></div>').join('')+'</div>';
if(page==='Subscriptions')v='<div class="heading"><div><h1>Subscriptions</h1><div class="sub">Plan and payment administration.</div></div></div><div class="notice">Razorpay checkout and verified webhooks are not connected yet. Never mark a subscription paid from a browser-only response.</div><div class="grid">'+metric('PLANS','3','Starter · Growth · Pro')+metric('ACTIVE SUBSCRIPTIONS','—','Backend required')+metric('REVENUE','—','Verified payments only')+metric('PAYMENT GATEWAY','Pending','Razorpay integration')+'</div>';
if(page==='Administrators')v='<div class="heading"><div><h1>Platform administrators</h1><div class="sub">Grant trusted operators access to master controls.</div></div></div><div class="notice">Admin invitations and permission changes must be performed through authenticated server-side workflows. No public sign-up grants platform access.</div><div class="card"><span class="pill warn">Secure invite workflow pending</span></div>';
if(page==='Platform settings')v='<div class="heading"><div><h1>Platform settings</h1><div class="sub">Global defaults and operational controls.</div></div></div><div class="card"><h3>Platform identity</h3><div class="field"><label>Product name</label><input value="GymKeep" disabled></div><div class="field"><label>Tenant routing</label><input value="gym-slug.gymkeep.app (domain setup pending)" disabled></div><div class="field"><label>Data isolation</label><input value="Separate Supabase project per gym (provisioning pending)" disabled></div></div>';
$('#view').innerHTML=v}
function metric(a,b,c){return '<div class="card"><div class="sub">'+a+'</div><div class="metric">'+b+'</div><div class="sub">'+c+'</div></div>'}
function gymList(list){if(!list.length)return '<div class="empty">No gym instances yet. Create your first gym to begin.</div>';return '<div class="list">'+list.map(g=>'<div class="item"><div class="row wrap"><div><strong>'+esc(g.name)+'</strong><div class="sub">'+esc(g.slug)+'.gymkeep.app · '+esc(g.owner)+'</div></div><span class="pill '+(g.status==='Active'?'':'off')+'">'+g.status+'</span></div><div class="actions"><button class="secondary" onclick="toggleGym(\''+g.id+'\')">'+(g.status==='Active'?'Suspend':'Activate')+'</button><button class="secondary" onclick="toast(\'Tenant provisioning is not connected yet\')">Open tenant</button></div></div>').join('')+'</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function createGym(e){e.preventDefault();toast('Secure tenant provisioning is not connected yet. No local preview was created.')}
function toggleGym(gid){let g=gyms.find(x=>x.id===gid);if(g){g.status=g.status==='Active'?'Suspended':'Active';save();render()}}
function setAccent(c){accent=c;save();render()}
render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
