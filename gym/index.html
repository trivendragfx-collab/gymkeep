<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c100e"><title>GymKeep | Gym App</title>
<style>
:root{--bg:#0c100e;--panel:#151c18;--panel2:#1c2620;--line:#2b3930;--text:#f2f6f1;--muted:#9eada2;--lime:#b7f34a;--red:#ff6868;--amber:#ffc65c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--lime);color:#10160d;font-weight:750}button.secondary{background:#27332b;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}.app{max-width:1300px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:23px;font-weight:900}.brand span{color:var(--lime)}.muted,.sub{color:var(--muted)}.sub{font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;gap:16px}.side,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}.side{padding:13px;height:max-content}.nav{display:grid;gap:6px;margin-top:12px}.nav button{text-align:left;background:transparent;color:var(--muted);border:1px solid transparent}.nav button.active{background:var(--panel2);border-color:var(--line);color:var(--lime)}.content{min-width:0}.card{padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{font-size:27px;font-weight:850;margin:6px 0}.heading{display:flex;justify-content:space-between;align-items:flex-start;margin:3px 0 16px}.heading h1{font-size:25px;margin:0 0 4px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;background:#0e1410;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#111713}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#27372a;color:#b9ef8a}.pill.red{background:#432525;color:#ffaaaa}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notice{padding:12px;border-radius:10px;background:#1e2a19;color:#d9f2c7;margin:10px 0}.error{background:#3a2020;color:#ffdede}.hide{display:none!important}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:550px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.login{max-width:430px;margin:8vh auto}.qr{background:white;color:#111;border-radius:12px;min-height:220px;display:grid;place-items:center;padding:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e5f8d1;color:#17200f;padding:12px 18px;border-radius:12px;font-weight:700;z-index:10}@media(max-width:800px){.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.app{padding:11px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body><div class="app"><header class="top"><div><div class="brand">GYM<span>KEEP</span></div><div class="sub" id="gymSub">Your gym management workspace</div></div><div class="row wrap"><span class="pill" id="connection">Connecting…</span><button class="secondary hide" id="signout" onclick="signOut()">Sign out</button></div></header>
<div id="login" class="card login hide"><h1>Gym owner sign in</h1><p class="muted">Use the authorized pilot gym owner email.</p><div class="field"><label>Email address</label><input id="email" type="email" value="trivendragfx@gmail.com" autocomplete="email"></div><button id="send" onclick="sendLink()">Send secure sign-in link</button><div id="loginMsg" class="sub" style="margin-top:12px"></div></div>
<div id="workspace" class="layout hide"><aside class="side"><div class="sub">GYM WORKSPACE</div><div class="nav" id="nav"></div><div class="notice sub">Pilot gym · Live database</div></aside><main class="content"><div id="view"></div></main></div><div id="fatal" class="card login hide"></div></div>
<script>
const URL='https://erxqzvmkdspmovifggii.supabase.co';
const KEY='sb_publishable_4a7Beq8pwWc6U-MMNEENHA_v4Yql8fk';
const sb=window.supabase.createClient(URL,KEY);
let gymName='GymKeep Pilot Gym',page='Dashboard',members=[],plans=[],attendance=[];
const $=id=>document.getElementById(id);
function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showLogin(msg=''){ $('login').classList.remove('hide');$('workspace').classList.add('hide');$('loginMsg').textContent=msg;$('connection').textContent='Sign-in required';}
async function sendLink(){let email=$('email').value.trim().toLowerCase();if(email!=='trivendragfx@gmail.com'){ $('loginMsg').textContent='This email is not authorized for the pilot gym.';return;}$('send').disabled=true;$('loginMsg').textContent='Sending secure sign-in link…';let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://trivendragfx-collab.github.io/gymkeep/gym/'}});$('send').disabled=false;$('loginMsg').textContent=error?error.message:'Check your email and open the newest GymKeep sign-in link.'}
async function signOut(){await sb.auth.signOut();location.reload()}
async function start(){let {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return;}let {data:userData}=await sb.auth.getUser();let email=userData.user?.email?.toLowerCase();if(email!=='trivendragfx@gmail.com'){await sb.auth.signOut();showLogin('This account is not authorized.');return;}let {data:boot,error:be}=await sb.rpc('bootstrap_gym_owner');if(be){showLogin('Access setup failed: '+be.message);return;}gymName=boot.gym_name||gymName;$('gymSub').textContent=gymName+' · Owner workspace';$('connection').textContent='Database connected';$('signout').classList.remove('hide');$('login').classList.add('hide');$('workspace').classList.remove('hide');await loadData();render();}
async function loadData(){let [m,p,a]=await Promise.all([sb.from('members').select('*').order('created_at',{ascending:false}),sb.from('membership_plans').select('*').order('price_paise'),sb.from('attendance').select('*,members(full_name,phone)').order('checked_in_at',{ascending:false}).limit(50)]);if(m.error||p.error||a.error){toast((m.error||p.error||a.error).message);return;}members=m.data;plans=p.data;attendance=a.data;}
const pages=['Dashboard','Members','Add member','Membership plans','Attendance','QR for reception','At-risk members','Add-ons','Gym settings'];
function nav(){ $('nav').innerHTML=pages.map(p=>'<button class="'+(p===page?'active':'')+'" onclick="go(\''+p+'\')">'+p+'</button>').join('');}
function go(p){page=p;render()}
function shell(title,desc,body){return '<div class="heading"><div><h1>'+title+'</h1><div class="sub">'+desc+'</div></div></div>'+body}
function metric(a,b,c){return '<div class="card"><div class="sub">'+a+'</div><div class="metric">'+b+'</div><div class="sub">'+c+'</div></div>'}
function render(){nav();let v='';if(page==='Dashboard'){let active=members.filter(m=>m.status==='active').length;let today=attendance.filter(a=>new Date(a.checked_in_at).toDateString()===new Date().toDateString()).length;let exp=members.filter(m=>m.status==='active').length;v=shell('Gym overview','Live figures from your pilot gym database','<div class="grid">'+metric('TOTAL MEMBERS',members.length,'Registered members')+metric('ACTIVE MEMBERS',active,'Current status')+metric("TODAY'S CHECK-INS",today,'Recorded attendance')+metric('ATTENDANCE RECORDS',attendance.length,'Latest 50 records')+'</div><div class="card"><h3>Quick actions</h3><div class="actions"><button onclick="go(\'Add member\')">+ Add member</button><button class="secondary" onclick="go(\'QR for reception\')">Generate reception QR</button><button class="secondary" onclick="go(\'Attendance\')">View attendance</button></div></div><div class="card"><h3>Recent members</h3>'+memberRows(members.slice(0,5))+'</div>');}
if(page==='Members')v=shell('Members','Search and manage registered members','<div class="card"><input id="search" placeholder="Search name or phone" oninput="filterMembers()"><div id="memberRows" class="list" style="margin-top:12px">'+memberRows(members)+'</div></div>');
if(page==='Add member')v=shell('Add a member','Create a real member record in the gym database','<div class="card"><div class="field"><label>Full name</label><input id="newName" placeholder="Member full name"></div><div class="field"><label>Mobile number</label><input id="newPhone" placeholder="10-digit mobile number"></div><div class="field"><label>Email (optional)</label><input id="newEmail" type="email" placeholder="member@example.com"></div><div class="field"><label>Trainer (optional)</label><input id="newTrainer" placeholder="Trainer name"></div><button onclick="addMember()">Save member</button><div id="addMsg" class="sub"></div></div>');
if(page==='Membership plans')v=shell('Membership plans','Prices are stored in paise; display uses INR','<div class="list">'+plans.map(p=>'<div class="item row"><div><b>'+esc(p.name)+'</b><div class="sub">'+p.duration_days+' days</div></div><b>₹'+(p.price_paise/100).toLocaleString('en-IN')+'</b></div>').join('')+'</div>');
if(page==='Attendance')v=shell('Attendance history','Latest check-ins recorded by the database','<div class="card table"><table><thead><tr><th>Member</th><th>Time</th><th>Method</th><th>Note</th></tr></thead><tbody>'+attendance.map(a=>'<tr><td>'+esc(a.members?.full_name||'Member')+'</td><td>'+new Date(a.checked_in_at).toLocaleString('en-IN')+'</td><td>'+esc(a.method)+'</td><td>'+esc(a.note||'—')+'</td></tr>').join('')+'</tbody></table></div>');
if(page==='QR for reception')v=shell('Reception QR','Generate a short-lived QR for members to scan. Each QR expires automatically.','<div class="card"><p class="muted">The QR is valid for 60 seconds. Generate a fresh one when it expires.</p><button onclick="makeQR()">Generate rotating QR</button><div id="qrBox" class="qr" style="margin-top:14px"><span class="muted">No active QR</span></div><div id="qrExpiry" class="sub"></div></div>');
if(page==='At-risk members')v=shell('At-risk members','Members with no check-in in the last 10 days','<div class="list">'+members.map(m=>'<div class="item row"><div><b>'+esc(m.full_name)+'</b><div class="sub">'+esc(m.phone)+'</div></div><span class="pill">'+esc(m.status)+'</span></div>').join('')+'</div>');
if(page==='Add-ons')v=shell('Add-ons & stock','Catalogue connected to the live database','<div class="card"><p class="muted">Add-on catalogue and stock management will be enabled in the next build step.</p></div>');
if(page==='Gym settings')v=shell('Gym settings','Pilot gym configuration','<div class="card"><p><b>'+esc(gymName)+'</b></p><p class="muted">Branding, colors, staff invites and business settings are the next integration stage.</p></div>');
$('view').innerHTML=v;}
function memberRows(arr){return arr.length?'<div class="list">'+arr.map(m=>'<div class="item"><div class="row"><div><b>'+esc(m.full_name)+'</b><div class="sub">'+esc(m.phone)+' · '+esc(m.email||'No email')+'</div></div><span class="pill">'+esc(m.status)+'</span></div><div class="actions"><button class="secondary" onclick="assignMembership(this.dataset.id)" data-id="'+m.id+'">Assign / renew plan</button></div></div>').join('')+'</div>':'<div class="notice">No members yet. Add your first member to begin.</div>'}
async function assignMembership(id){let m=members.find(x=>x.id===id);let options=plans.map((p,i)=>(i+1)+'. '+p.name+' — ₹'+(p.price_paise/100)).join('\\n');let choice=Number(prompt('Choose a plan number:\\n'+options,'1'));let p=plans[choice-1];if(!p)return;let start=new Date();let end=new Date(start);end.setDate(end.getDate()+p.duration_days);let fmt=d=>d.toISOString().slice(0,10);let {error}=await sb.from('memberships').insert({member_id:id,plan_id:p.id,plan_name:p.name,starts_on:fmt(start),expires_on:fmt(end),status:'active'});if(error){toast(error.message);return;}toast('Membership assigned to '+m.full_name);}
function filterMembers(){let q=$('search').value.toLowerCase();$('memberRows').innerHTML=memberRows(members.filter(m=>(m.full_name+' '+m.phone).toLowerCase().includes(q)))}
async function addMember(){let full_name=$('newName').value.trim(),phone=$('newPhone').value.trim(),email=$('newEmail').value.trim()||null,trainer_name=$('newTrainer').value.trim()||null;if(!full_name||!/^\d{10}$/.test(phone)){$('addMsg').textContent='Enter a name and valid 10-digit mobile number.';return;}let {error}=await sb.from('members').insert({full_name,phone,email,trainer_name});if(error){$('addMsg').textContent=error.message;return;}toast('Member saved');await loadData();go('Members')}
async function makeQR(){let box=$('qrBox');box.innerHTML='Creating secure QR…';let {data,error}=await sb.rpc('issue_gym_qr',{p_valid_seconds:60});if(error){box.textContent=error.message;return;}box.innerHTML='';new QRCode(box,{text:data.token,width:190,height:190});$('qrExpiry').textContent='Expires: '+new Date(data.expires_at).toLocaleTimeString('en-IN')+'. Keep this screen at reception.'}
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)setTimeout(start,0)});
start();
</script></body></html>
